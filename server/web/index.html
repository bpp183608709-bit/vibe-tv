<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aerial">
<meta name="format-detection" content="telephone=no">
<title>Aerial</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ------------------------------------------------------------------ sign in / sign up -->
<section id="screen-auth" class="screen auth" hidden>
  <!-- One form for six jobs. Which fields show up is decided by `data-modes` (see showAuth in
       app.js): sign in, sign up, upgrading an old phone, asking the question, answering it, and
       changing the password while signed in. -->
  <form id="auth-form" class="pair-card" autocomplete="on" novalidate>
    <div class="pair-brand">
      <img src="icon.svg" alt="" width="52" height="52">
    </div>
    <h1 id="auth-title" data-i18n="auth.signInTitle"></h1>
    <p id="auth-hint" class="muted"></p>

    <label class="field" data-modes="in up claim recover recover2">
      <span class="field-label" data-i18n="auth.email"></span>
      <input id="auth-email" name="email" type="email" inputmode="email" maxlength="160" required
             autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="name@example.com" enterkeyhint="next">
    </label>

    <!-- Recovering, second half: the question this account chose, read back verbatim, and the
         answer goes with it — before the new password, not after. -->
    <p id="auth-question" class="question" data-modes="recover2"></p>
    <label class="field" data-modes="recover2">
      <span class="field-label" data-i18n="auth.answerLabel"></span>
      <input id="auth-answer2" name="answer" type="text" maxlength="100"
             autocomplete="off" autocapitalize="off" enterkeyhint="next">
    </label>

    <label class="field" data-modes="change">
      <span class="field-label" data-i18n="auth.oldPassword"></span>
      <input id="auth-old" name="old_password" type="password" maxlength="128" required
             autocomplete="current-password" enterkeyhint="next">
    </label>

    <label class="field" data-modes="in up claim recover2 change">
      <span class="field-label" id="auth-password-label" data-i18n="auth.password"></span>
      <input id="auth-password" name="password" type="password" minlength="8" maxlength="128" required
             autocomplete="current-password" enterkeyhint="next">
    </label>
    <label class="field" data-modes="up claim recover2 change">
      <span class="field-label" data-i18n="auth.password2"></span>
      <input id="auth-password2" name="password2" type="password" minlength="8" maxlength="128" required
             autocomplete="new-password" enterkeyhint="next">
    </label>

    <!-- The rules, visible while typing instead of only in an error after submitting. The four
         checks mirror `password_problem()` in server/app/auth.py. -->
    <ul id="auth-rules" class="rules" data-modes="up claim recover2 change">
      <li data-rule="length"><i></i><span data-i18n="auth.ruleLength"></span></li>
      <li data-rule="digits"><i></i><span data-i18n="auth.ruleDigits"></span></li>
      <li data-rule="notemail"><i></i><span data-i18n="auth.ruleNotEmail"></span></li>
      <li data-rule="common"><i></i><span data-i18n="auth.ruleCommon"></span></li>
      <li data-rule="match"><i></i><span data-i18n="auth.ruleMatch"></span></li>
    </ul>

    <!-- Last, and optional: the recovery question only matters the day the password is forgotten,
         which is never the moment someone signs up. Both fields are checked together in
         `checkLocally()` — a question without an answer is not something to send. -->
    <p class="group-label" data-modes="up claim" data-i18n="auth.questionGroup"></p>

    <label class="field" data-modes="up claim question">
      <span class="field-label" data-i18n="auth.questionLabel"></span>
      <input id="auth-question-input" name="question" type="text" maxlength="120"
             autocomplete="off" enterkeyhint="next">
    </label>
    <label class="field" data-modes="up claim question">
      <span class="field-label" data-i18n="auth.answerLabel"></span>
      <input id="auth-answer" name="answer" type="text" maxlength="100"
             autocomplete="off" autocapitalize="off" enterkeyhint="go">
    </label>

    <!-- The honeypot: off screen, out of the tab order, and never filled by a person. A bot that
         fills every field gets a 400 that says nothing. -->
    <label class="hp" aria-hidden="true">
      <span>website</span>
      <input id="auth-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </label>
    <p id="auth-error" class="error" role="alert" hidden></p>

    <button id="auth-submit" class="primary" type="submit" data-i18n="auth.signIn"></button>
    <p class="note tiny" id="auth-switch-line">
      <a href="#" id="auth-switch" data-i18n="auth.toSignUp"></a>
    </p>
    <p class="note tiny" id="auth-forgot-line">
      <a href="#" id="auth-forgot" data-i18n="auth.forgot"></a>
    </p>
    <p class="note tiny" id="auth-noreset" data-i18n="auth.noReset"></p>
  </form>
</section>

<!-- ------------------------------------------------------------------ pairing -->
<section id="screen-pair" class="screen pair" hidden>
  <form id="pair-form" class="pair-card" autocomplete="off" novalidate>
    <div class="pair-brand">
      <img src="icon.svg" alt="" width="52" height="52">
    </div>
    <h1 data-i18n="pair.title"></h1>
    <p class="muted" data-i18n="pair.hint"></p>

    <label class="field">
      <span class="field-label" data-i18n="pair.code"></span>
      <!-- autocapitalize/autocorrect off, spellcheck false: the code is case-sensitive (G6) and a
           phone that helpfully capitalises the first letter makes it look broken. -->
      <input id="pair-code" name="code" type="text" inputmode="text" maxlength="6" required
             autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"
             placeholder="······" enterkeyhint="go">
    </label>
    <p class="note" data-i18n="pair.case"></p>
    <p id="pair-error" class="error" role="alert" hidden></p>

    <button id="pair-submit" class="primary" type="submit" data-i18n="pair.submit"></button>
    <p class="note tiny" data-i18n="pair.ttl"></p>
  </form>
</section>

<!-- ------------------------------------------------------------------ signed in -->
<section id="screen-main" class="screen" hidden>
  <header class="topbar">
    <!-- The name is the switcher: one account can hold several televisions, and "which one am I
         looking at" has to be answerable from anywhere, not only from the settings tab. -->
    <button class="topbar-title" id="device-switch" type="button">
      <p class="eyebrow" data-i18n="app.parent"></p>
      <h1 id="device-name">—</h1>
    </button>
    <button id="lang" class="chip" type="button" aria-label="language"></button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" type="button" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.9"/></svg>
      <span data-i18n="tab.today"></span>
    </button>
    <button class="tab" type="button" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-5"/></svg>
      <span data-i18n="tab.week"></span>
    </button>
    <button class="tab" type="button" data-tab="wrong">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h9.5L20 9v10.5H6z"/><path d="M9 12.5h8M9 16h5"/></svg>
      <span data-i18n="tab.wrong"></span>
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2.2"/><circle cx="10" cy="16" r="2.2"/></svg>
      <span data-i18n="tab.settings"></span>
    </button>
  </nav>
</section>

<div id="toast" class="toast" role="status" hidden></div>

<!-- The device sheet: which television, another one, or out. A sheet rather than a page because it is
     one decision, taken from wherever the parent happens to be. -->
<div id="sheet-backdrop" class="sheet-backdrop" hidden>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div id="sheet-body"></div>
    <button id="sheet-close" class="quiet" type="button" data-i18n="common.close"></button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
